<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#12211c"><meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Chunk Loop</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><div><span class="eyebrow">ENGLISH PRACTICE</span><h1>Chunk Loop</h1></div><button id="install" hidden>Install</button></header>
  <main>
    <section id="menu" aria-label="Lesson menu">
      <div class="intro"><p>Listen. Notice the chunk.<br>Make it yours.</p><span id="offlineState">Preparing offline mode…</span></div>
      <ol id="lessonList"></ol>
    </section>
    <section id="study" hidden aria-label="Study screen">
      <div class="progress"><span id="counter"></span><span id="playingState">LOOPING</span></div>
      <div class="card"><p id="sentence"></p><button id="translationToggle">日本語を表示</button><p id="japanese" hidden></p></div>
      <p id="error" role="alert"></p>
      <div class="controls"><button id="play" class="primary">Pause</button><div class="row"><button id="back">Menu</button><button id="next">Next →</button></div></div>
    </section>
  </main>
  <audio id="audio" preload="auto" loop></audio><script src="app.js"></script>
</body>
</html>
